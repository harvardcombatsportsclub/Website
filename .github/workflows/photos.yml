name: Rebuild photo gallery

# Runs whenever anything in photos/ changes (e.g. an officer drags images into
# the folder on github.com → "Add file" → "Upload files"). It makes thumbnails,
# shrinks oversized originals, regenerates data/photos.json, and commits.
on:
  push:
    branches: [main]
    paths:
      - "photos/**"
      - "!photos/people/**"
      - "!photos/legacy/**"
      - "scripts/build_photos.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Don't loop on our own commit
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build_photos.py
      - name: Commit gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A photos data/photos.json
          if git diff --cached --quiet; then echo "Gallery unchanged"; exit 0; fi
          git commit -m "Rebuild photo gallery"
          # The editor may have pushed other commits meanwhile: rebase and retry a few times
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (branch moved), retrying…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1
