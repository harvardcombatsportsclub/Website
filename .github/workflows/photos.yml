name: Rebuild photo gallery

# Runs whenever anything in photos/ changes (e.g. an officer drags images into
# the folder on github.com → "Add file" → "Upload files"). It makes thumbnails,
# shrinks oversized originals, regenerates data/photos.json, and commits.
on:
  push:
    branches: [main]
    paths:
      - "photos/**"
      - "scripts/build_photos.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Don't loop on our own commit
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build_photos.py
      - name: Commit gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A photos data/photos.json
          git diff --cached --quiet || git commit -m "Rebuild photo gallery"
          git push
